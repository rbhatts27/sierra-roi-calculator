<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sierra ROI Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 30px 0;
            color: white;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            opacity: 0.8;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: white;
            color: #1a1a2e;
        }
        .card {
            background: white;
            border-radius: 0 0 15px 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4a90d9;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        button[type="submit"], .btn {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button[type="submit"]:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 144, 217, 0.4);
        }
        .results-box {
            background: linear-gradient(135deg, #e8f4f8 0%, #d4edda 100%);
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }
        .results-box h3 {
            color: #1a1a2e;
            margin-bottom: 15px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-value {
            font-weight: 700;
            color: #2d7a4f;
            font-size: 1.2rem;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
        }
        .search-box button {
            width: auto;
            padding: 12px 25px;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .results-table th, .results-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .results-table th {
            background: #f5f5f5;
            font-weight: 600;
        }
        .results-table tr:hover {
            background: #f9f9f9;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sierra ROI Calculator</h1>
            <p>Calculate and track your return on investment</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('calculator')">Calculator</button>
            <button class="tab-btn" onclick="showTab('search')">Search Records</button>
        </div>

        <div class="card">
            <!-- Calculator Tab -->
            <div id="calculator" class="tab-content active">
                <div id="calcMessage" class="message"></div>
                <form id="roiForm">
                    <div class="row">
                        <div class="form-group">
                            <label>Customer Name *</label>
                            <input type="text" name="customer_name" required placeholder="Enter customer name">
                        </div>
                        <div class="form-group">
                            <label>Account SID *</label>
                            <input type="text" name="account_sid" required placeholder="e.g., AC123456789">
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Current Annual Cost ($) *</label>
                            <input type="number" name="current_annual_cost" required min="0" step="0.01" placeholder="e.g., 100000">
                        </div>
                        <div class="form-group">
                            <label>Expected Cost Reduction (%) *</label>
                            <input type="number" name="expected_cost_reduction" required min="0" max="100" step="0.1" placeholder="e.g., 25">
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Implementation Cost ($)</label>
                            <input type="number" name="implementation_cost" min="0" step="0.01" value="0" placeholder="e.g., 50000">
                        </div>
                        <div class="form-group">
                            <label>Annual Maintenance Cost ($)</label>
                            <input type="number" name="annual_maintenance_cost" min="0" step="0.01" value="0" placeholder="e.g., 10000">
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Time to Value (months)</label>
                            <input type="number" name="time_to_value" min="0" value="3" placeholder="e.g., 3">
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <input type="text" name="notes" placeholder="Optional notes...">
                        </div>
                    </div>

                    <button type="submit">Calculate & Save ROI</button>
                </form>

                <div id="resultsBox" class="results-box">
                    <h3>ROI Results</h3>
                    <div class="metric">
                        <span>ROI Percentage</span>
                        <span class="metric-value" id="roiPercent">-</span>
                    </div>
                    <div class="metric">
                        <span>Net Annual Savings</span>
                        <span class="metric-value" id="netSavings">-</span>
                    </div>
                    <div class="metric">
                        <span>Payback Period</span>
                        <span class="metric-value" id="paybackPeriod">-</span>
                    </div>
                </div>
            </div>

            <!-- Search Tab -->
            <div id="search" class="tab-content">
                <div id="searchMessage" class="message"></div>
                <div class="search-box">
                    <input type="text" id="searchCustomer" placeholder="Customer Name">
                    <input type="text" id="searchSID" placeholder="Account SID">
                    <button class="btn" onclick="searchRecords()">Search</button>
                </div>
                <button class="btn" onclick="loadAll()" style="margin-bottom: 20px; background: linear-gradient(135deg, #6c757d 0%, #495057 100%);">Load All Records</button>

                <div id="searchResults">
                    <div class="no-results">Enter search criteria or load all records</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        document.getElementById('roiForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    showMessage('calcMessage', 'Data saved successfully!', 'success');
                    document.getElementById('resultsBox').style.display = 'block';
                    document.getElementById('roiPercent').textContent = result.roi_results.roi_percentage + '%';
                    document.getElementById('netSavings').textContent = '$' + result.roi_results.net_savings.toLocaleString();
                    document.getElementById('paybackPeriod').textContent = result.roi_results.payback_months + ' months';
                } else {
                    showMessage('calcMessage', result.message, 'error');
                }
            } catch (err) {
                showMessage('calcMessage', 'Error saving data: ' + err.message, 'error');
            }
        });

        async function searchRecords() {
            const customer = document.getElementById('searchCustomer').value;
            const sid = document.getElementById('searchSID').value;

            if (!customer && !sid) {
                showMessage('searchMessage', 'Please enter customer name or account SID', 'error');
                return;
            }

            try {
                const params = new URLSearchParams();
                if (customer) params.append('customer_name', customer);
                if (sid) params.append('account_sid', sid);

                const response = await fetch('/api/search?' + params);
                const result = await response.json();
                displayResults(result);
            } catch (err) {
                showMessage('searchMessage', 'Error searching: ' + err.message, 'error');
            }
        }

        async function loadAll() {
            try {
                const response = await fetch('/api/all');
                const result = await response.json();
                displayResults(result);
            } catch (err) {
                showMessage('searchMessage', 'Error loading records: ' + err.message, 'error');
            }
        }

        function displayResults(result) {
            const container = document.getElementById('searchResults');

            if (!result.success || result.count === 0) {
                container.innerHTML = '<div class="no-results">No records found</div>';
                return;
            }

            let html = `<p style="margin-bottom:10px"><strong>${result.count} record(s) found</strong></p>`;
            html += `<table class="results-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Account SID</th>
                        <th>Annual Cost</th>
                        <th>ROI %</th>
                        <th>Net Savings</th>
                        <th>Payback</th>
                    </tr>
                </thead>
                <tbody>`;

            result.results.forEach(r => {
                html += `<tr>
                    <td>${r['Timestamp'] || '-'}</td>
                    <td>${r['Customer Name'] || '-'}</td>
                    <td>${r['Account SID'] || '-'}</td>
                    <td>$${(r['Current Annual Cost'] || 0).toLocaleString()}</td>
                    <td>${r['Calculated ROI (%)'] || 0}%</td>
                    <td>$${(r['Net Savings'] || 0).toLocaleString()}</td>
                    <td>${r['Payback Period (months)'] || 0} mo</td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function showMessage(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'message ' + type;
            setTimeout(() => { el.className = 'message'; }, 5000);
        }
    </script>
</body>
</html>
